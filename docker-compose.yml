services:
  google-earth-topo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-earth-topo
    restart: unless-stopped
    ports:
      - "9088:9088"
    environment:
      HOST: 0.0.0.0
      PORT: 9088
      MAX_ZOOM: 17
      TILE_SOURCE_TEMPLATE: https://a.tile.opentopomap.org/{z}/{x}/{y}.png
      LOG_FILE: /data/server.log
    volumes:
      - ./data:/data

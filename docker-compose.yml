services:
  google-earth-topo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-earth-topo
    restart: unless-stopped
    environment:
      PORT: 80
      PUBLIC_PORT: ${APP_PORT:-80}
      MAX_ZOOM: 17
      LOG_FILE: /data/server.log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/kml/root.kml', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    volumes:
      - ./data:/data
    networks:
      pidor-net:
        aliases:
          - google-earth-topo.pidor.local

  nginx:
    image: nginx:alpine
    container_name: google-earth-topo-nginx
    restart: unless-stopped
    depends_on:
      google-earth-topo:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx-cache:/var/cache/nginx
      - ./data/nginx-logs:/var/log/nginx
    networks:
      pidor-net:
        aliases:
          - google-earth-topo-nginx.pidor.local

networks:
  pidor-net:
    external: true
    name: pidor-net

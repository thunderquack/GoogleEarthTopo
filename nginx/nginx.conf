worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $host "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time '
                    'uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
                    'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    proxy_cache_path /var/cache/nginx/tiles
        levels=1:2
        keys_zone=tile_cache:100m
        max_size=10g
        inactive=30d
        use_temp_path=off;

    upstream kml_backend {
        server google-earth-topo:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass http://kml_backend;
        }

        location /kml/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass http://kml_backend;
        }

        location /tiles/ {
            proxy_ssl_server_name on;
            proxy_set_header Host a.tile.opentopomap.org;
            proxy_set_header User-Agent "GoogleEarthTopo-NginxCache/0.1";
            proxy_cache tile_cache;
            proxy_cache_key $scheme$proxy_host$request_uri;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 301 302 1d;
            proxy_cache_valid 404 10m;
            proxy_cache_valid any 1m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            expires 30d;
            proxy_pass https://a.tile.opentopomap.org;
        }
    }
}
